name: Build and publish Docker fallback image

# Builds the Dockerfile on GitHub's own runner and pushes it to GHCR (GitHub
# Container Registry) -- one of the registries the Participant Guide names
# explicitly ("Docker Hub, GHCR, or equivalent"). Used because this project's
# dev machine cannot run Docker Desktop locally (WSL2/virtualization
# unavailable); this workflow needs no local Docker and no extra account,
# since it authenticates with GitHub's own built-in token.
#
# No repository secrets are required for the build/push itself. The image
# does not embed any API keys -- those are supplied at `docker run` time.
#
# After the first successful run, the package defaults to the same visibility
# as the repository. If the repo is private, go to:
#   GitHub profile -> Packages -> gridwise-llm -> Package settings -> Change visibility -> Public
# so the image stays pullable by the judge even while the repo itself is private.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=1.0.0
            type=sha,format=long

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the pushed image reaches /health
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          echo "Pulling and running: $IMAGE"
          docker run -d --name gridwise-check -p 8000:8000 "$IMAGE"
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "health check never became ready"
          docker logs gridwise-check
          exit 1

      - name: Print the exact pullable reference
        run: |
          echo "### Pullable image reference" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:1.0.0" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
